name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Compare the complete event diff, including multi-commit pushes.
          fetch-depth: 0

      - name: Detect visual-impacting changes
        id: visual_changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Pull request checkout is a synthetic merge commit. Its first parent
            # tracks the current actual base even when event base.sha is stale.
            BASE="$(git rev-parse HEAD^1)"
          else
            BASE="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")"
          fi

          RUN_VISUAL=false
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            # New/unusual history must never silently omit a relevant gate.
            RUN_VISUAL=true
            echo "No comparable base commit; running visual QA conservatively."
          else
            CHANGED_FILES="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
            echo "Changed paths:"
            printf '%s\n' "$CHANGED_FILES"
            # Run for all UI, assets, scripts, tests, build config and CI changes.
            # Documentation-only changes still get lint, typecheck, tests and build.
            if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(src/|public/|tests/visual/|scripts/|\.github/workflows/|playwright\.config\.ts$|next\.config\.|postcss\.config\.|tailwind\.config\.|package\.json$|pnpm-lock\.yaml$)'; then
              RUN_VISUAL=true
            fi
          fi

          if [ "$GITHUB_EVENT_NAME" = "push" ] && jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH" | grep -Fq '[visual]'; then
            RUN_VISUAL=true
          fi
          echo "run=$RUN_VISUAL" >> "$GITHUB_OUTPUT"
          echo "Visual capture, Playwright and lab required: $RUN_VISUAL"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Visualizer script syntax
        run: |
          node --check scripts/sync-radio-visualizer.mjs
          node --check scripts/inspect-radio-visualizer.mjs
          node --check scripts/lib/visualizer-diagnostics.mjs
          node --check scripts/capture-radio-states.mjs
          python3 -m py_compile scripts/analyze-radio-visualizer.py

      - name: Build
        run: pnpm build

      - name: Capture visual review
        if: steps.visual_changes.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-review
          pnpm start > /tmp/cm-radioand3d-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/cm-radioand3d-next.log
              exit 1
            fi
            sleep 1
          done

          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "No Chromium-compatible browser found on the runner."
            exit 1
          fi






          BROWSER="$BROWSER" node scripts/capture-radio-states.mjs "$GITHUB_WORKSPACE/visual-review"

      - name: Playwright visual diagnostics
        if: steps.visual_changes.outputs.run == 'true'
        run: pnpm visual:qa

      - name: Collect stable visual review screenshots
        if: steps.visual_changes.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Browser CLI virtual-time-budget had captured the Home mid-letter
          # reveal even at 4800ms. Playwright captures are made after the
          # CSS animation completes and the fonts/images are ready.
          copy_capture() {
            local test_path="$1"
            local project="$2"
            local file_name="$3"
            local dest="$4"
            local source
            source="$(find test-results/visual -type f -path "*${test_path}*${project}*" -name "$file_name" -print -quit)"
            if [ -z "$source" ]; then
              echo "Required stable capture missing: $test_path / $project / $file_name" >&2
              exit 1
            fi
            cp "$source" "visual-review/$dest"
          }
          copy_capture home-hero-responsive desktop-1440 home-x1-default.png desktop-1440.png
          copy_capture home-hero-responsive desktop-short home-x1-default.png desktop-short-1760x824.png
          copy_capture home-hero-responsive mobile-390 home-x1-default.png mobile-390.png
          copy_capture home-hero-responsive desktop-1440 home-x1-radio-expanded.png home-radio-expanded-1440.png
          copy_capture home-hero-responsive desktop-1440 home-x1-split-restored.png home-radio-restored-1440.png
          copy_capture home-hero-responsive desktop-1440 home-x1-radio-docked.png home-radio-docked-1440.png
          copy_capture home-hero-responsive desktop-1440 home-normal-motion.png home-normal-motion-1440.png
          copy_capture home-hero-responsive mobile-390 home-normal-motion.png home-normal-motion-390.png
          copy_capture public-pages-capture-and-inspect-product desktop-1440 product-viewport.png product-desktop-1440.png
          copy_capture public-pages-capture-and-inspect-product mobile-390 product-viewport.png product-mobile-390.png

      - name: Install browser video recorder for optional 03c QA
        if: steps.visual_changes.outputs.run == 'true'
        run: pnpm exec playwright install ffmpeg

      - name: Render isolated visual lab in development
        if: steps.visual_changes.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Isolate the dev compiler and next/font cache from the earlier
          # production build used for the public/CDP captures.
          CM_VISUAL_LAB_QA=1 pnpm dev --hostname 127.0.0.1 --port 3100 > /tmp/cm-visual-lab-next.log 2>&1 &
          LAB_PID=$!
          trap 'kill "$LAB_PID" 2>/dev/null || true' EXIT

          for attempt in {1..75}; do
            STATUS="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/dev/visual-lab || true)"
            if [ "$STATUS" = "200" ]; then
              break
            fi
            if [ "$attempt" -eq 75 ]; then
              cat /tmp/cm-visual-lab-next.log
              echo "Development visual lab did not respond with HTTP 200"
              exit 1
            fi
            sleep 1
          done

          VISUAL_LAB_QA=1 VISUAL_REVIEW_URL=http://127.0.0.1:3100 \
            pnpm exec playwright test tests/visual/visual-lab.spec.ts tests/visual/studio-carousel-motion.spec.ts \
            --project=desktop-1440 --project=desktop-1024 \
            --project=mobile-390 --project=mobile-360

          # Preserve honest technical carousel renders before a second
          # Playwright invocation clears the development lab output directory.
          mkdir -p visual-review
          for media_name in carousel-fixture-first-photo.png carousel-fixture-second-photo.png; do
            capture="$(find test-results/visual-lab -type f -name "$media_name" -print -quit)"
            if [ -z "$capture" ]; then
              echo "Expected Studio motion screenshot missing: $media_name" >&2
              exit 1
            fi
            cp "$capture" "visual-review/$media_name"
          done

          node scripts/build-visual-lab-review.mjs

          # D4: render a dedicated preview with the real CM shell and audio provider.
          # The route must remain unavailable in the production build.
          VISUAL_LAB_QA=1 VISUAL_REVIEW_URL=http://127.0.0.1:3100 \
            pnpm exec playwright test tests/visual/radio-dock-preview.spec.ts \
            --project=desktop-1440 --project=desktop-short \
            --project=desktop-1024 --project=mobile-390

      - name: Upload Playwright diagnostics
        if: always() && (steps.visual_changes.outputs.run == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: cm-visual-diagnostics
          path: |
            test-results/visual/**
            test-results/visual-lab/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload visual review
        if: (steps.visual_changes.outputs.run == 'true') && success()
        uses: actions/upload-artifact@v4
        with:
          name: studio-radio-visual-review
          path: visual-review/*.png
          retention-days: 7

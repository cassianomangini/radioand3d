name: bootstrap-visual-dependencies-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-visual-dependencies-once.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install existing locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install chosen runtime and QA libraries with locked resolutions
        run: |
          pnpm add motion@^12
          pnpm add -D @playwright/test@^1 @axe-core/playwright@^4
          pnpm pkg set "scripts.visual:qa=playwright test"
      - name: Check baseline and build
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Commit manifests only and push safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: install Motion Playwright and axe with pnpm lock"
            git push origin HEAD:main
          fi
      - name: Show actual installed versions
        run: |
          pnpm list motion @playwright/test @axe-core/playwright --depth 0

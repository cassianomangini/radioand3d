name: SEO technical validation

on:
  pull_request:
    paths:
      - "src/app/**"
      - "src/features/products/**"
      - "src/server/products/**"
      - "src/lib/site-seo.ts"
      - "next.config.ts"
      - "vercel.json"
      - "tests/seo.test.cjs"
      - "tests/catalog-source-sync.test.cjs"
      - "tests/catalog-durable-storage.test.cjs"
      - "tests/catalog-product-editorial.test.cjs"
      - "tests/product-editorial-titles.test.cjs"
      - ".github/workflows/seo-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/app/**"
      - "src/features/products/**"
      - "src/server/products/**"
      - "src/lib/site-seo.ts"
      - "next.config.ts"
      - "vercel.json"
      - "tests/seo.test.cjs"
      - "tests/catalog-source-sync.test.cjs"
      - "tests/catalog-durable-storage.test.cjs"
      - "tests/catalog-product-editorial.test.cjs"
      - "tests/product-editorial-titles.test.cjs"
      - ".github/workflows/seo-validation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.30.3
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint SEO files
        run: >-
          pnpm exec eslint
          src/lib/site-seo.ts
          src/features/products/search-approval.ts
          src/features/products/catalog-source-contract.ts
          src/features/products/catalog-source-editorial.ts
          src/features/products/catalog-contract.ts
          src/server/products/catalog.ts
          src/server/products/catalog-snapshot-store.ts
          src/app/api/internal/site-catalog-refresh/route.ts
          src/features/products/product-breadcrumb-jsonld.ts
          src/app/robots.ts
          src/app/sitemap.ts
          src/app/layout.tsx
          src/app/page.tsx
          src/app/produtos/page.tsx
          src/app/produtos/error.tsx
          'src/app/produtos/[slug]/page.tsx'
          src/app/estudio/page.tsx
          src/app/orcamentos/page.tsx
          next.config.ts
          tests/seo.test.cjs
          tests/catalog-source-sync.test.cjs
          tests/catalog-durable-storage.test.cjs
      - name: Generate route types
        run: pnpm exec next typegen
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

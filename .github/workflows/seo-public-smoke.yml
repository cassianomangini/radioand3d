name: SEO public runtime smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/seo_public_smoke.py"
      - ".github/workflows/seo-public-smoke.yml"

permissions:
  contents: read

jobs:
  check-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check public URLs, indexability, canonical, sitemap, purchase links, images
        run: python3 scripts/seo_public_smoke.py

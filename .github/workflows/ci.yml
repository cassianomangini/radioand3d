name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Visualizer script syntax
        run: |
          node --check scripts/sync-radio-visualizer.mjs
          node --check scripts/inspect-radio-visualizer.mjs
          node --check scripts/lib/visualizer-diagnostics.mjs
          node --check scripts/capture-radio-states.mjs
          python3 -m py_compile scripts/analyze-radio-visualizer.py

      - name: Build
        run: pnpm build

      - name: Capture visual review
        if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[visual]')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-review
          pnpm start > /tmp/cm-radioand3d-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/cm-radioand3d-next.log
              exit 1
            fi
            sleep 1
          done

          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "No Chromium-compatible browser found on the runner."
            exit 1
          fi

          "$BROWSER"             --headless=new             --no-sandbox             --disable-gpu             --hide-scrollbars             --virtual-time-budget=1600             --run-all-compositor-stages-before-draw             --window-size=1440,1000             --screenshot="$GITHUB_WORKSPACE/visual-review/desktop-1440.png"             http://127.0.0.1:3000/

          "$BROWSER"             --headless=new             --no-sandbox             --disable-gpu             --hide-scrollbars             --virtual-time-budget=1600             --run-all-compositor-stages-before-draw             --window-size=1760,824             --screenshot="$GITHUB_WORKSPACE/visual-review/desktop-short-1760x824.png"             http://127.0.0.1:3000/

          "$BROWSER"             --headless=new             --no-sandbox             --disable-gpu             --hide-scrollbars             --virtual-time-budget=1600             --run-all-compositor-stages-before-draw             --window-size=390,844             --screenshot="$GITHUB_WORKSPACE/visual-review/mobile-390.png"             http://127.0.0.1:3000/

          "$BROWSER"             --headless=new             --no-sandbox             --disable-gpu             --hide-scrollbars             --virtual-time-budget=2200             --run-all-compositor-stages-before-draw             --window-size=1440,1000             --screenshot="$GITHUB_WORKSPACE/visual-review/product-desktop-1440.png"             http://127.0.0.1:3000/studio/produtos/porta-curativos-compacto

          "$BROWSER"             --headless=new             --no-sandbox             --disable-gpu             --hide-scrollbars             --virtual-time-budget=2200             --run-all-compositor-stages-before-draw             --window-size=390,844             --screenshot="$GITHUB_WORKSPACE/visual-review/product-mobile-390.png"             http://127.0.0.1:3000/studio/produtos/porta-curativos-compacto

          BROWSER="$BROWSER" node scripts/capture-radio-states.mjs "$GITHUB_WORKSPACE/visual-review"

      - name: Playwright visual diagnostics
        if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[visual]')
        run: pnpm visual:qa

      - name: Render isolated visual lab in development
        if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[visual]')
        shell: bash
        run: |
          set -euo pipefail
          pnpm dev --hostname 127.0.0.1 --port 3100 > /tmp/cm-visual-lab-next.log 2>&1 &
          LAB_PID=$!
          trap 'kill "$LAB_PID" 2>/dev/null || true' EXIT

          for attempt in {1..75}; do
            STATUS="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/dev/visual-lab || true)"
            if [ "$STATUS" = "200" ]; then
              break
            fi
            if [ "$attempt" -eq 75 ]; then
              cat /tmp/cm-visual-lab-next.log
              echo "Development visual lab did not respond with HTTP 200"
              exit 1
            fi
            sleep 1
          done

          VISUAL_LAB_QA=1 VISUAL_REVIEW_URL=http://127.0.0.1:3100 \
            pnpm exec playwright test tests/visual/visual-lab.spec.ts \
            --project=desktop-1440 --project=mobile-390

          node scripts/build-visual-lab-review.mjs

      - name: Upload Playwright diagnostics
        if: always() && (github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[visual]'))
        uses: actions/upload-artifact@v4
        with:
          name: cm-visual-diagnostics
          path: |
            test-results/visual/**
            test-results/visual-lab/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload visual review
        if: (github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[visual]')) && success()
        uses: actions/upload-artifact@v4
        with:
          name: studio-radio-visual-review
          path: visual-review/*.png
          retention-days: 7

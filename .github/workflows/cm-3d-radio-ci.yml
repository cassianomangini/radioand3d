name: CM 3D Radio CI
on:
  pull_request:
    paths:
      - "cm-3d-radio-novo/**"
      - ".github/workflows/cm-3d-radio-ci.yml"
  push:
    branches: [cmc/renew, main]
    paths:
      - "cm-3d-radio-novo/**"
      - ".github/workflows/cm-3d-radio-ci.yml"

permissions:
  contents: read

concurrency:
  group: cm3d-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cm_quote_security_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: cm-3d-radio-novo
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.30.3
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: cm-3d-radio-novo/pnpm-lock.yaml
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Generate Next.js route types
        run: pnpm exec next typegen
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Scanner worker syntax
        run: |
          node --check scripts/quote-malware-scan-worker.mjs
          node --check scripts/lib/quote-scan-core.mjs
      - name: Database quota and quarantine tests
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -h 127.0.0.1 -U postgres -d cm_quote_security_ci -v ON_ERROR_STOP=1 \
            -f tests/sql/quote-security-fixture.sql \
            -f supabase/migrations/20261103202500_quote_owner_quota_and_quarantine.sql \
            -f tests/sql/quote-security-assertions.sql
      - name: Production build
        run: pnpm build
      - name: Runtime dependency security audit
        run: pnpm audit --prod --audit-level=high
